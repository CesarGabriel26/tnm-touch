<router-outlet />
<loading-overlay />
<app-dialog />

@if (localNetworkAccess.requiresAction()) {
<div class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/45 p-4 backdrop-blur-sm"
  role="alertdialog" aria-modal="true" aria-labelledby="local-network-title">
  <section class="w-full max-w-md rounded-lg bg-white p-6 text-center shadow-2xl">
    <span class="material-symbols-outlined text-5xl text-orange-600">lan</span>
    <h1 id="local-network-title" class="mt-3 text-xl font-bold text-slate-900">
      Permissão de rede local necessária
    </h1>
    <p class="mt-2 text-sm leading-6 text-slate-600">
      {{ localNetworkAccess.message() }}
    </p>
    <button type="button"
      class="mt-6 inline-flex h-11 w-full items-center justify-center gap-2 rounded-lg bg-orange-600 px-4 font-bold text-white transition-colors hover:bg-orange-700 disabled:opacity-60"
      [disabled]="localNetworkAccess.state() === 'checking'"
      (click)="localNetworkAccess.requestAccess()">
      <span class="material-symbols-outlined text-xl">refresh</span>
      Tentar novamente
    </button>
  </section>
</div>
}
