<div class="relative flex flex-col h-dvh w-dvw overflow-hidden bg-slate-100">

    <!-- Header -->
    <header class="relative z-30 flex h-14 shrink-0 items-center gap-3
               border-b border-slate-200/80
               bg-white/90 px-3
               backdrop-blur-xl">

        <!-- Usuário -->
        <div class="flex min-w-0 flex-1 items-center gap-2.5">

            <div class="flex h-9 w-9 shrink-0 items-center justify-center
                       rounded-full bg-orange-500
                       text-xs font-bold text-white
                       shadow-sm shadow-orange-500/20">

                <span class="capitalize">
                    {{ user().name ? user().name.slice(0, 2) : '' }}
                </span>

            </div>

            <div class="min-w-0">
                <p class="truncate text-sm font-semibold text-slate-700">
                    {{ user().name }}
                </p>
            </div>

        </div>


        <!-- Menu / Home -->
        <button av-button (click)="isHome ? drawerOpen.set(!drawerOpen()) : goHome()" class="!h-10 !w-10 !rounded-xl !border-0
                   bg-slate-100 shadow-none
                   hover:bg-slate-200
                   active:scale-95 transition-all">

            <span av-icon [name]="isHome ? 'menu' : 'home'" type="material" size="md">
            </span>

        </button>

    </header>


    <!-- Conteúdo -->
    <main class="min-h-0 flex-1 overflow-hidden">

        <router-outlet />

    </main>


    <!-- Bottom Navigation -->
    <nav class="relative z-30 flex h-[68px] shrink-0 items-center
               justify-between
               border-t border-slate-200/80
               bg-white/95
               px-3 pb-2 pt-2
               backdrop-blur-xl
               shadow-[0_-8px_30px_rgba(15,23,42,0.08)]">

        <!-- Voltar -->
        <button av-button (click)="goBack()" [disabled]="isHome" class="!h-11 !w-11 !rounded-xl
                   !border-0
                   shadow-none
                   disabled:opacity-30
                   active:scale-95 transition-all">

            <span av-icon name="arrow_back" type="material" size="xl">
            </span>

        </button>


        <!-- Ação principal -->
        <button av-button variant="blue" rounded="full" (click)="openOrder()">
            <span av-icon name="add" type="material" size="2xl">
            </span>
        </button>


        <!-- Carrinho -->
        <button #basket av-button variant="orange" routerLink="/basket" class="relative !h-11 !w-11 !rounded-xl
                   !border-0
                   shadow-none
                   active:scale-95
                   transition-all
                   overflow-visible!">

            <span av-icon name="shopping_basket" type="material" size="xl">
            </span>

            @if (orderDraftService.quantity() > 0) {

            <span av-badge variant="red" class="absolute -right-1.5 -top-1.5
                           min-w-5 !h-5
                           !px-1
                           flex items-center justify-center
                           text-[10px]
                           border-2 border-white">

                {{ orderDraftService.quantity() }}

            </span>

            }

        </button>

    </nav>


    <!-- Drawer -->
    <div class="absolute inset-0 z-50
               bg-slate-950/30
               backdrop-blur-[2px]
               transition-opacity duration-300" [ngClass]="{
            'opacity-100 pointer-events-auto': drawerOpen(),
            'opacity-0 pointer-events-none': !drawerOpen()
        }" (click)="drawerOpen.set(false)">

        <!-- Drawer -->
        <aside class="absolute left-0 top-0
                   flex h-full w-[280px] flex-col
                   bg-white
                   shadow-[8px_0_30px_rgba(15,23,42,0.12)]
                   transition-transform duration-300" [ngClass]="{
                'translate-x-0': drawerOpen(),
                '-translate-x-full': !drawerOpen()
            }" (click)="$event.stopPropagation()">


            <!-- Drawer Header -->
            <div class="flex h-16 shrink-0 items-center gap-2
                       border-b border-slate-100 px-3">

                <div class="flex h-10 w-10 items-center justify-center
                           rounded-xl">

                    <img src="assets/icon.svg" alt="">

                </div>

                <div class="min-w-0 flex-1">

                    <h1 class="truncate text-base font-bold text-slate-800">
                        Tanamao Touch
                    </h1>

                    <p class="text-[10px] text-slate-400">
                        Atendimento
                    </p>

                </div>

                <button av-button (click)="drawerOpen.set(false)" class="!h-9 !w-9 !rounded-xl !border-0
                           bg-slate-100 shadow-none">

                    <span av-icon name="close" type="material" size="lg">
                    </span>

                </button>

            </div>


            <!-- Conteúdo futuro do menu -->
            <div class="flex-1 overflow-auto p-3">

                <!-- itens de menu podem entrar aqui -->

            </div>


            <!-- Usuário -->
            <div class="flex shrink-0 items-center gap-2
                       border-t border-slate-100
                       bg-slate-50/70
                       p-3">

                <div class="flex h-9 w-9 shrink-0 items-center justify-center
                           rounded-full bg-orange-500
                           text-xs font-bold text-white">

                    <span class="capitalize">
                        {{ user().name ? user().name.slice(0, 2) : '' }}
                    </span>

                </div>

                <div class="min-w-0 flex-1">

                    <p class="truncate text-xs font-semibold text-slate-700">
                        {{ user().name }}
                    </p>

                    <p class="text-[10px] text-slate-400">
                        Usuário conectado
                    </p>

                </div>

                <button av-button variant="red" (click)="leave()" class="!h-9 !w-9 !rounded-xl !border-0">

                    <span av-icon name="logout" type="material" size="lg">
                    </span>

                </button>

            </div>

        </aside>

    </div>

</div>
